<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Aura Moon Retreat - Đăng nhập</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .input-minimal:focus {
            outline: none;
            box-shadow: none;
        }

        .glass-effect {
            background: rgba(251, 249, 248, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(251, 249, 248, 0.1);
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#787770",
                        "surface-bright": "#fbf9f8",
                        "secondary-fixed": "#dae8be",
                        "on-tertiary-fixed": "#002106",
                        "surface-dim": "#dcd9d9",
                        "primary-fixed": "#e5e2dd",
                        "inverse-surface": "#303030",
                        "secondary": "#566342",
                        "inverse-primary": "#c9c6c2",
                        "on-error-container": "#93000a",
                        "on-tertiary": "#ffffff",
                        "on-error": "#ffffff",
                        "tertiary-fixed": "#c1eebc",
                        "on-secondary": "#ffffff",
                        "tertiary-fixed-dim": "#a5d2a2",
                        "tertiary-container": "#d1ffcb",
                        "on-primary-fixed": "#1c1c19",
                        "surface-variant": "#e4e2e1",
                        "on-secondary-container": "#5a6745",
                        "primary-fixed-dim": "#c9c6c2",
                        "on-secondary-fixed-variant": "#3f4b2c",
                        "background": "#fbf9f8",
                        "surface-container-high": "#eae8e7",
                        "secondary-fixed-dim": "#becca3",
                        "tertiary": "#406840",
                        "inverse-on-surface": "#f3f0f0",
                        "on-background": "#1b1c1c",
                        "primary-container": "#f5f2ed",
                        "on-surface-variant": "#474741",
                        "surface-container-highest": "#e4e2e1",
                        "error-container": "#ffdad6",
                        "surface-container": "#f0eded",
                        "on-primary": "#ffffff",
                        "secondary-container": "#d7e5bb",
                        "on-tertiary-fixed-variant": "#284f2a",
                        "on-surface": "#1b1c1c",
                        "on-primary-container": "#6f6e6a",
                        "error": "#ba1a1a",
                        "on-secondary-fixed": "#141f05",
                        "surface-tint": "#5f5e5b",
                        "surface": "#fbf9f8",
                        "primary": "#5f5e5b",
                        "outline-variant": "#c8c7be",
                        "on-tertiary-container": "#4f784f",
                        "surface-container-low": "#f6f3f2",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed-variant": "#474743"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-lg": "32px",
                        "margin-desktop": "80px",
                        "gutter": "24px",
                        "section-gap": "120px",
                        "margin-mobile": "20px",
                        "stack-sm": "8px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "display-lg": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"],
                        "label-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"]
                    },
                    "fontSize": {
                        "display-lg": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                        "headline-lg": ["40px", {"lineHeight": "48px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg-mobile": ["40px", {"lineHeight": "48px", "fontWeight": "400"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased overflow-hidden">
<main class="flex min-h-screen">
    <!-- Left Section: Visual Brand Identity -->
    <section class="hidden lg:block lg:w-3/5 relative overflow-hidden">
        <div class="absolute inset-0 z-10 bg-black/10"></div>
        <img alt="Luxury infinity pool at sunrise overlooking misty mountains and rice terraces"
             class="absolute inset-0 w-full h-full object-cover transform scale-105 transition-transform duration-[10000ms] ease-out hover:scale-100"
             src="https://lh3.googleusercontent.com/aida/ADBb0ujC1JqPnqkD3WvY6dkRhH_4HardNKXM59i_-LanZtKuN6k2lYdmgdyutA0atHl4WDHrvlN_44xLo13QA9gV9XDwVo4xEaGh_sg681-ApFG-4koqCZY32ypVUWZ5lWW2RQ9_wRy64LAFlBGd5nVNkpEqpl_W4RRkWSLrK2LuoULx5tFOzEtmgRl6CAeB_CbpDk2S48_lQnNJ1kIoW-uhUG-zv70QdgtAuE8aNHCizzPf-kaioH9oKQyIxkY"
             style="transform: scale(1.05) translate(-6.46px, -4.7px);">
        <div class="absolute inset-0 z-20 flex flex-col justify-between p-margin-desktop">
            <div class="flex items-center gap-stack-sm">
                <span class="font-display-lg text-headline-sm text-surface-lowest tracking-tight">Aura Moon</span>
            </div>
            <div class="max-w-xl">
                <p class="font-display-lg text-headline-lg text-surface-lowest leading-snug">
                    Nơi tâm hồn tìm thấy <br>sự tĩnh lặng tuyệt đối.
                </p>
                <div class="w-24 h-[1px] bg-surface-lowest/40 mt-stack-lg"></div>
            </div>
        </div>
    </section>
    <!-- Right Section: Login Form -->
    <section
            class="w-full lg:w-2/5 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop bg-surface relative">
        <!-- Mobile Brand Logo -->
        <div class="lg:hidden absolute top-8 left-8">
            <span class="font-display-lg text-headline-sm text-primary tracking-tight">Xoài Aura</span>
        </div>
        <div class="w-full max-w-md">
            <div class="mb-section-gap/2">
                <h1 class="font-headline-lg text-headline-lg text-on-surface mb-stack-sm">Chào mừng trở lại</h1>
                <p class="font-body-md text-on-surface-variant">Đăng nhập để tiếp tục hành trình tỉnh thức của bạn.</p>
            </div>
            <form class="space-y-stack-lg" onsubmit="event.preventDefault();">
                <!-- Email Field -->
                <div class="space-y-stack-sm">
                    <label class="font-label-md text-label-md text-on-surface-variant uppercase"
                           for="email">Email</label>
                    <input class="w-full bg-surface-container-low border-b-2 border-outline-variant focus:border-secondary transition-colors px-0 py-3 input-minimal font-body-md text-on-surface placeholder-outline-variant"
                           id="email" placeholder="email@example.com" type="email">
                </div>
                <!-- Password Field -->
                <div class="space-y-stack-sm">
                    <div class="flex justify-between items-center">
                        <label class="font-label-md text-label-md text-on-surface-variant uppercase" for="password">Mật
                            khẩu</label>
                        <a class="font-label-md text-label-md text-secondary hover:underline underline-offset-4 transition-all"
                           href="#">Quên mật khẩu?</a>
                    </div>
                    <input class="w-full bg-surface-container-low border-b-2 border-outline-variant focus:border-secondary transition-colors px-0 py-3 input-minimal font-body-md text-on-surface placeholder-outline-variant"
                           id="password" placeholder="••••••••" type="password">
                </div>
                <!-- Main Login Button -->
                <button class="w-full bg-secondary text-surface-white py-4 font-label-md text-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex justify-center items-center gap-stack-sm"
                        type="submit">
                    Đăng nhập
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                </button>
            </form>
            <!-- Divider -->
            <div class="relative flex items-center my-stack-lg">
                <div class="flex-grow border-t border-outline-variant/30"></div>
                <span class="flex-shrink mx-4 font-label-md text-label-md text-on-surface-variant/60 uppercase">Hoặc</span>
                <div class="flex-grow border-t border-outline-variant/30"></div>
            </div>
            <!-- SSO Buttons -->
            <div class="grid grid-cols-2 gap-gutter">
                <button class="flex items-center justify-center gap-stack-sm py-3 border border-outline-variant/40 rounded-lg hover:bg-surface-container-low transition-colors">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                              fill="#4285F4"></path>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                              fill="#34A853"></path>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                              fill="#FBBC05"></path>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                              fill="#EA4335"></path>
                    </svg>
                    <span class="font-label-md text-label-md text-on-surface-variant">Google</span>
                </button>

            </div>
            <!-- Footer Sign up link -->
            <div class="mt-section-gap/3 text-center">
                <p class="font-body-md text-on-surface-variant">
                    Chưa có tài khoản?
                    <a class="text-secondary font-label-md text-label-md hover:underline underline-offset-4 ml-1"
                       href="#">Đăng ký ngay</a>
                </p>
            </div>
        </div>
        <!-- Footer Small -->
        <div class="absolute bottom-8 w-full text-center">
            <p class="text-[12px] text-on-surface-variant/50 uppercase tracking-widest font-label-md">© 2024 Xoài Aura
                Retreat</p>
        </div>
    </section>
</main>
<script>
    // Subtle micro-interaction for the inputs
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', () => {
            input.parentElement.querySelector('label').style.color = 'var(--secondary)';
        });
        input.addEventListener('blur', () => {
            input.parentElement.querySelector('label').style.color = '';
        });
    });

    // Background parallax effect
    document.addEventListener('mousemove', (e) => {
        const img = document.querySelector('img');
        if (img) {
            const x = (window.innerWidth - e.pageX * 2) / 100;
            const y = (window.innerHeight - e.pageY * 2) / 100;
            img.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
        }
    });
</script>


</body>
</html>
