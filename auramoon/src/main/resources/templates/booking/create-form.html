<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Đặt Gói & Biệt Thự | Xoai Aura Retreat</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/booking/booking-form.css}">
</head>
<body class="bg-[#fbf9f8] text-[#1b1c1c] font-sans">
    <main class="min-h-screen py-16 px-4 md:px-8 max-w-4xl mx-auto">
        <a th:href="@{/packages/{id}(id=${pkg.id})}" class="inline-flex items-center gap-2 text-[#566342] hover:underline mb-8">
            <span class="material-symbols-outlined">arrow_back</span> Quay lại chi tiết gói
        </a>

        <!-- Glassmorphism Container -->
        <div class="glass-card bg-white/70 backdrop-blur-md border border-white/20 p-8 md:p-12 rounded-2xl shadow-xl">
            <div class="border-b border-gray-200 pb-6 mb-8">
                <span class="text-sm font-semibold tracking-wider text-[#566342] uppercase block" th:text="${pkg.typePackage}">Loại gói</span>
                <h1 class="text-3xl md:text-4xl font-serif text-gray-900 mt-2" th:text="'Đặt lịch: ' + ${pkg.packageName}">Tên gói</h1>
                <p class="text-gray-500 mt-2">Điền thông tin của bạn để xác nhận đặt lịch lưu trú và trị liệu.</p>
            </div>

            <!-- Package Brief Summary Card -->
            <div class="bg-[#f5f2ed] border border-[#c8c7be] rounded-xl p-6 mb-8 grid grid-cols-1 md:grid-cols-3 gap-6">
                <div>
                    <span class="text-xs font-semibold uppercase text-gray-400 block">Thời lượng</span>
                    <span class="text-lg font-medium text-[#566342]" th:text="${pkg.durationDays} + ' Ngày'">3 Ngày</span>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase text-gray-400 block">Chi phí trọn gói</span>
                    <span class="text-lg font-serif text-[#566342]" th:text="${#numbers.formatDecimal(pkg.price,0,'COMMA',0,'POINT')} + ' đ'">15,000,000 đ</span>
                </div>
                <div>
                    <span class="text-xs font-semibold uppercase text-gray-400 block">Dịch vụ chính</span>
                    <span class="text-sm text-gray-600 block line-clamp-2" th:text="${pkg.services}">Dịch vụ</span>
                </div>
            </div>

            <form th:action="@{/booking/create}" method="post" th:object="${bookingRequest}" class="space-y-6">
                <!-- Hidden inputs -->
                <input type="hidden" name="retreatPackageId" th:value="${pkg.id}" />

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Date input -->
                    <div class="flex flex-col gap-2">
                        <label for="checkinDate" class="text-sm font-semibold text-gray-700">Ngày Check-in</label>
                        <input type="date" id="checkinDate" name="checkinDate" required th:value="${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"
                               class="w-full bg-transparent border-gray-300 rounded-lg focus:ring-[#566342] focus:border-[#566342]" />
                    </div>

                    <!-- Total guests input -->
                    <div class="flex flex-col gap-2">
                        <label for="totalGuests" class="text-sm font-semibold text-gray-700">Số lượng khách đi cùng</label>
                        <input type="number" id="totalGuests" name="totalGuests" required min="1" max="10" value="2"
                               class="w-full bg-transparent border-gray-300 rounded-lg focus:ring-[#566342] focus:border-[#566342]" />
                    </div>
                </div>

                <!-- Villa Selection -->
                <div class="flex flex-col gap-3">
                    <label class="text-sm font-semibold text-gray-700">Chọn Loại Villa Lưu Trú</label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div th:each="vt : ${villaTypes}" class="relative border border-gray-200 rounded-xl p-4 flex gap-4 hover:border-[#566342] hover:bg-[#566342]/5 transition-all">
                            <input type="radio" name="villaTypeId" th:value="${vt.id}" th:id="'vt-' + ${vt.id}" required
                                   class="mt-1 text-[#566342] focus:ring-[#566342] border-gray-300" />
                            <label th:for="'vt-' + ${vt.id}" class="flex-1 cursor-pointer">
                                <span class="font-semibold block text-gray-900" th:text="${vt.typeName}">Ocean View</span>
                                <span class="text-xs text-gray-500 block">Tiêu chuẩn sang trọng bậc nhất</span>
                                <span class="text-sm font-medium text-[#566342] mt-2 block" th:text="'+ ' + ${#numbers.formatDecimal(vt.pricePerDay,0,'COMMA',0,'POINT')} + ' đ / ngày'">Phụ thu</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="border-t border-gray-200 pt-6 mt-8 flex justify-end">
                    <button type="submit" class="px-8 py-3 bg-[#566342] text-white rounded-lg font-semibold hover:bg-[#566342]/90 transition-colors shadow-md flex items-center gap-2">
                        Xác nhận & Thanh toán cọc <span class="material-symbols-outlined">payments</span>
                    </button>
                </div>
            </form>
        </div>
    </main>
    <script th:src="@{/js/booking/booking-form.js}"></script>
</body>
</html>
