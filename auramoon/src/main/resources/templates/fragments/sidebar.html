<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
    <aside th:fragment="sidebar"
        class="h-screen w-64 fixed left-0 top-0 bg-surface-container-low border-r border-outline-variant flex flex-col py-stack-lg z-50">
        <div class="px-6 mb-10">
            <h1 class="font-headline-sm text-headline-sm text-primary">Xoai Aura</h1>
            <p class="font-label-md text-label-md text-on-surface-variant opacity-70">Luxury Wellness Retreat</p>
        </div>
        <nav class="flex-1 px-4 space-y-1">
            <a class="flex items-center gap-3 px-4 py-3 text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-colors duration-200"
                href="#">
                <span class="material-symbols-outlined" data-icon="dashboard">dashboard</span>
                <span class="font-label-md text-label-md">Dashboard</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 bg-secondary-container text-on-secondary-container rounded-xl scale-[0.98] transition-transform"
                th:href="@{/packages}">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                <span class="font-label-md text-label-md">Retreat Package</span>
            </a>
            <a class="flex items-center gap-3 px-4 py-3 bg-secondary-container text-on-secondary-container rounded-xl scale-[0.98] transition-transform"
                th:href="@{/spa/therapists/{code}/schedules}">
                <span class="material-symbols-outlined" data-icon="logout">logout</span>
                <span class="font-label-md text-label-md">Therapist</span>
            </a>
        </nav>
    </aside>
</body>

</html>
