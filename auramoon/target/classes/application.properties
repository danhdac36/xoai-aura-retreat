spring.application.name=auramoon
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HoS;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=none

# VNPay Configuration Sandbox
vnp_PayUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnp_ReturnUrl=/billing/checkout/vnpay-return
vnp_TmnCode=${vnp_TmnCode_Secret}
vnp_HashSecret=${vnp_HashSecret_Secret}

spring.config.import=optional:classpath:application-secret.properties
