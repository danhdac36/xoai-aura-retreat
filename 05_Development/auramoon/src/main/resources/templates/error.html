<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Error</title>
</head>
<body>
    <h1>Application Error</h1>
    <p style="color: red;" th:text="${errorMessage}">Error message will appear here</p>
    <hr>
    <h3>Exception details:</h3>
    <pre th:text="${exception}"></pre>
</body>
</html>
