<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Sơ Đồ Biệt Thự | Xoai Aura Retreat</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/reception/reception.css}">
</head>

<body class="bg-[#fbf9f8] text-[#1b1c1c] font-sans" th:classappend="${#authorization.expression('isAuthenticated() and !hasRole(''GUEST'')')} ? 'md:pl-64' : ''">
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

    <main class="py-12 px-4 md:px-12 max-w-[1440px] mx-auto">
        <!-- Nút quay lại trang trước đó -->
        <a href="javascript:history.back()"
            class="inline-flex items-center gap-1.5 text-[#566342] hover:text-[#3f4b2c] font-medium transition-colors mb-6 group">
            <span
                class="material-symbols-outlined text-lg transition-transform group-hover:-translate-x-1">arrow_back</span>
            <span>Quay lại trang trước</span>
        </a>

        <div class="mb-8">
            <h1 class="text-3xl font-serif text-gray-900">Sơ Đồ Tình Trạng Biệt Thự (Villa Diagram)</h1>
            <p class="text-gray-500 mt-1">Trạng thái thời gian thực của các căn biệt thự nghỉ dưỡng.</p>
        </div>

        <!-- Feedback Alert Messages -->
        <div th:if="${param.success}"
            class="mb-6 p-4 bg-green-50 border-l-4 border-green-500 text-green-700 rounded-r-lg flex items-center gap-2">
            <span class="material-symbols-outlined">check_circle</span>
            <span th:text="${param.success}">Thành công</span>
        </div>
        <div th:if="${param.error}"
            class="mb-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 rounded-r-lg flex items-center gap-2">
            <span class="material-symbols-outlined">error</span>
            <span th:text="${param.error}">Lỗi</span>
        </div>

        <!-- Villa Grid Diagram -->
        <section class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <div th:each="v : ${villas}"
                class="border border-gray-200 bg-white rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between">
                <div>
                    <!-- Villa Code & Type -->
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-xs font-semibold uppercase text-gray-400 block"
                                th:text="${v.villaTypeName}">Ocean View</span>
                            <span class="text-xl font-bold text-gray-900 mt-1 block"
                                th:text="${v.villaCode}">VIL-101</span>
                        </div>

                        <!-- Status indicator color badge -->
                        <span th:if="${v.villaStatus == 'AVAILABLE'}"
                            class="px-2 py-1 text-xs font-semibold rounded-full bg-green-50 text-green-600">Trống</span>
                        <span th:if="${v.villaStatus == 'OCCUPIED'}"
                            class="px-2 py-1 text-xs font-semibold rounded-full bg-red-50 text-red-600">Đang ở</span>
                        <span th:if="${v.villaStatus == 'MAINTENANCE'}"
                            class="px-2 py-1 text-xs font-semibold rounded-full bg-yellow-50 text-yellow-600">Bảo
                            trì</span>
                    </div>

                    <div class="border-t border-gray-100 pt-4 space-y-2 text-sm text-gray-600">
                        <div class="flex justify-between">
                            <span>Sức chứa:</span>
                            <span class="font-medium text-gray-900" th:text="${v.limitPerson} + ' Khách'">2 Khách</span>
                        </div>
                        <div class="flex justify-between">
                            <span>Vệ sinh:</span>
                            <span th:if="${v.cleaningStatus == 'CLEAN'}" class="text-green-600 font-semibold">Đã dọn
                                dẹp</span>
                            <span th:if="${v.cleaningStatus == 'DIRTY'}" class="text-red-500 font-semibold">Chưa dọn
                                dẹp</span>
                        </div>
                    </div>
                </div>

                <!-- Update Status Form -->
                <form th:action="@{/receptionist/villa/status}" method="post"
                    class="mt-6 border-t border-gray-100 pt-4 grid grid-cols-2 gap-2">
                    <input type="hidden" name="villaId" th:value="${v.id}" />
                    <select name="villaStatus"
                        class="bg-gray-50 border border-gray-200 rounded-lg text-xs p-2 focus:ring-[#566342] focus:border-[#566342]">
                        <option value="AVAILABLE" th:selected="${v.villaStatus == 'AVAILABLE'}">Trống</option>
                        <option value="OCCUPIED" th:selected="${v.villaStatus == 'OCCUPIED'}">Đang ở</option>
                        <option value="MAINTENANCE" th:selected="${v.villaStatus == 'MAINTENANCE'}">Bảo trì</option>
                    </select>

                    <select name="cleaningStatus"
                        class="bg-gray-50 border border-gray-200 rounded-lg text-xs p-2 focus:ring-[#566342] focus:border-[#566342]">
                        <option value="CLEAN" th:selected="${v.cleaningStatus == 'CLEAN'}">Sạch</option>
                        <option value="DIRTY" th:selected="${v.cleaningStatus == 'DIRTY'}">Bẩn</option>
                        <option value="CLEANING" th:selected="${v.cleaningStatus == 'CLEANING'}">Đang dọn</option>
                    </select>

                    <button type="submit"
                        class="col-span-2 mt-2 py-2 bg-gray-100 text-[#566342] font-semibold text-xs rounded-lg hover:bg-[#566342]/10 transition-colors">
                        Cập nhật
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>

</html>
