<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::div})}">
<head>
    <title>Guest Feedback | Xoai Aura</title>
</head>
<body>
    <div class="w-full">
        <!-- Load specific CSS and JS -->
        <link rel="stylesheet" th:href="@{/css/booking/reviews.css}" />
        <script th:src="@{/js/booking/reviews-tailwind.js}"></script>

        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-stack-lg">
            <div class="flex items-center gap-3">
                <span class="material-symbols-outlined text-primary dark:text-primary-fixed text-[32px]" data-icon="spa">spa</span>
                <h2 class="font-headline-lg text-headline-lg text-on-surface mb-2">Guest Feedback</h2>
            </div>
            <button class="hover:opacity-80 transition-opacity bg-surface-container-highest p-2.5 rounded-lg">
                <span class="material-symbols-outlined text-on-surface-variant" data-icon="search">search</span>
            </button>
        </div>

        <!-- Summary Cards Section -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-gutter mb-12">
            <div class="bg-secondary-container/30 rounded-xl p-6 flex flex-col justify-between h-40 shadow-[0_10px_40px_rgba(45,90,39,0.03)] border border-outline-variant/20">
                <div>
                    <span class="font-label-caps text-[12px] uppercase tracking-wider text-on-secondary-container">Total Reviews</span>
                    <h2 class="font-headline-lg text-headline-lg text-primary mt-2" th:text="${metrics.totalReviews}">320</h2>
                </div>
                <div class="flex items-center text-primary/60">
                    <span class="material-symbols-outlined text-sm mr-1" data-icon="trending_up">trending_up</span>
                    <span class="text-[12px] uppercase tracking-wider">+12% this month</span>
                </div>
            </div>
            <div class="bg-secondary-container/30 rounded-xl p-6 flex flex-col justify-between h-40 shadow-[0_10px_40px_rgba(45,90,39,0.03)] border border-outline-variant/20">
                <div>
                    <span class="font-label-caps text-[12px] uppercase tracking-wider text-on-secondary-container">Average Rating</span>
                    <div class="flex items-baseline gap-2 mt-2">
                        <h2 class="font-headline-lg text-headline-lg text-primary" th:text="${metrics.averageRating}">4.9</h2>
                        <span class="text-primary-container font-headline-sm">/ 5.0</span>
                    </div>
                </div>
                <div class="flex gap-0.5 text-primary">
                    <span class="material-symbols-outlined text-lg" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="material-symbols-outlined text-lg" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="material-symbols-outlined text-lg" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="material-symbols-outlined text-lg" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                    <span class="material-symbols-outlined text-lg" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                </div>
            </div>
        </section>

        <!-- Main Section: Data Table -->
        <section class="space-y-6">
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-headline-sm text-headline-sm text-primary">Recent Experiences</h3>
                <button class="font-label-caps text-[12px] uppercase tracking-wider text-primary border-b border-primary/20 pb-0.5">Filter by Date</button>
            </div>
            
            <!-- Table Header (Hidden on Mobile, Flex on MD) -->
            <div class="hidden md:flex px-6 py-4 bg-surface-container-low rounded-t-xl border-b border-outline-variant/30 text-on-surface-variant font-label-caps text-[12px] uppercase tracking-wider">
                <div class="w-1/6">Booking ID</div>
                <div class="w-1/6">Guest Name</div>
                <div class="w-1/6">Star Rating</div>
                <div class="w-2/6">Comment</div>
                <div class="w-1/6 text-right">Action</div>
            </div>
            
            <!-- Responsive List/Table -->
            <div class="space-y-4 md:space-y-0">
                <th:block th:each="review : ${reviews}">
                    <div class="bg-white md:bg-transparent p-6 md:px-6 md:py-8 rounded-xl md:rounded-none md:border-b border-outline-variant/10 flex flex-col md:flex-row md:items-start transition-all hover:bg-secondary-container/10">
                        <div class="md:w-1/6 mb-2 md:mb-0">
                            <span class="md:hidden font-label-caps text-[10px] text-on-surface-variant block">Booking ID</span>
                            <a class="text-primary font-semibold hover:underline" href="#" th:text="'#XA-' + ${review.booking.id}">#XA-9283</a>
                        </div>
                        <div class="md:w-1/6 mb-4 md:mb-0">
                            <span class="md:hidden font-label-caps text-[10px] text-on-surface-variant block">Guest</span>
                            <a class="text-primary font-semibold hover:underline" href="#" th:text="'Guest ' + ${review.booking.guestId}">Nguyen Lan Anh</a>
                        </div>
                        <div class="md:w-1/6 mb-4 md:mb-0">
                            <div class="flex text-primary">
                                <span th:each="i : ${#numbers.sequence(1, review.rating)}" class="material-symbols-outlined text-[16px]" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
                                <span th:if="${review.rating < 5}" th:each="i : ${#numbers.sequence(review.rating + 1, 5)}" class="material-symbols-outlined text-[16px]" data-icon="star">star</span>
                            </div>
                        </div>
                        <div class="md:w-2/6 mb-6 md:mb-0">
                            <span class="md:hidden font-label-caps text-[10px] text-on-surface-variant block">Feedback</span>
                            <p class="italic text-on-surface-variant font-headline-sm text-sm leading-relaxed" th:text="${review.comment}">"An absolutely transformative experience."</p>
                        </div>
                        <div class="md:w-1/6 text-right">
                            <button th:data-id="${review.id}" class="bg-primary-container text-on-primary-container px-5 py-2 rounded-full font-label-caps text-[10px] uppercase tracking-widest hover:opacity-90 active:scale-95 transition-all">
                                Hide
                            </button>
                        </div>
                    </div>
                </th:block>
            </div>
        </section>

        <!-- Micro-interactions Script -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const buttons = document.querySelectorAll('button');
                buttons.forEach(btn => {
                    if (btn.innerText.includes('Hide')) {
                        btn.addEventListener('click', function() {
                            const row = this.closest('.bg-white, .md:bg-transparent');
                            row.style.opacity = '0';
                            row.style.transform = 'translateY(10px)';
                            row.style.transition = 'all 0.4s ease';
                            setTimeout(() => {
                                row.style.display = 'none';
                            }, 400);
                        });
                    }
                });
            });
        </script>
    </div>
</body>
</html>
