<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::div})}">

<head>
    <title>Thêm Tài khoản Mới</title>
</head>

<body>
    <div id="main-content" th:fragment="main-content" class="w-full max-w-2xl mx-auto">
        
        <!-- Header Section -->
        <div class="mb-6 flex items-center gap-4">
            <a th:href="@{/manager/account}" data-ajax="true" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 text-gray-600 transition-colors">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Thêm Tài khoản Mới</h1>
                <p class="text-gray-500 text-sm mt-1">Điền thông tin chi tiết để cấp tài khoản</p>
            </div>
        </div>

        <!-- Alert Messages -->
        <div th:if="${errorMessage}" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-lg shadow-sm">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <i class="fas fa-exclamation-circle text-red-500"></i>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700 font-medium" th:text="${errorMessage}"></p>
                </div>
            </div>
        </div>

        <!-- Form Section -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 md:p-8">
            <form th:action="@{/manager/account/create}" th:object="${accountDTO}" method="post" data-ajax="true" class="space-y-6">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- Full Name -->
                    <div class="col-span-1 md:col-span-2">
                        <label for="fullName" class="block text-sm font-medium text-gray-700 mb-1">
                            Họ và Tên <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input type="text" id="fullName" th:field="*{fullName}" 
                                   class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors"
                                   th:classappend="${#fields.hasErrors('fullName') ? 'border-red-300 text-red-900 focus:ring-red-500 focus:border-red-500' : ''}"
                                   placeholder="Nguyễn Văn A">
                        </div>
                        <p th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}" class="mt-2 text-sm text-red-600 flex items-center gap-1">
                            <i class="fas fa-exclamation-circle"></i> Lỗi
                        </p>
                    </div>

                    <!-- Email -->
                    <div class="col-span-1 md:col-span-2">
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                            Email <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-envelope text-gray-400"></i>
                            </div>
                            <input type="email" id="email" th:field="*{email}"
                                   class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors"
                                   th:classappend="${#fields.hasErrors('email') ? 'border-red-300 text-red-900 focus:ring-red-500 focus:border-red-500' : ''}"
                                   placeholder="nguyenvana@example.com">
                        </div>
                        <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="mt-2 text-sm text-red-600 flex items-center gap-1">
                            <i class="fas fa-exclamation-circle"></i> Lỗi
                        </p>
                        <p style="color: #db7c66">Mật khẩu mặc định: 123456!</p>
                    </div>

                    <!-- Phone -->
                    <div class="col-span-1">
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">
                            Số điện thoại
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-phone text-gray-400"></i>
                            </div>
                            <input type="text" id="phone" th:field="*{phone}"
                                   class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors"
                                   placeholder="0912345678">
                        </div>
                    </div>

                    <!-- Identify Code -->
                    <div class="col-span-1">
                        <label for="identifyCode" class="block text-sm font-medium text-gray-700 mb-1">
                            CCCD/CMND
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-id-card text-gray-400"></i>
                            </div>
                            <input type="text" id="identifyCode" th:field="*{identifyCode}"
                                   class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors"
                                   placeholder="012345678901">
                        </div>
                    </div>

                    <!-- Role -->
                    <div class="col-span-1 md:col-span-2">
                        <label for="roleId" class="block text-sm font-medium text-gray-700 mb-1">
                            Chức vụ <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user-tag text-gray-400"></i>
                            </div>
                            <select id="roleId" th:field="*{roleId}"
                                    class="pl-10 block w-full rounded-lg border-gray-300 shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm transition-colors"
                                    th:classappend="${#fields.hasErrors('roleId') ? 'border-red-300 text-red-900 focus:ring-red-500 focus:border-red-500' : ''}">
                                <option value="" disabled selected>-- Chọn chức vụ --</option>
                                <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.roleName}"></option>
                            </select>
                        </div>
                        <p th:if="${#fields.hasErrors('roleId')}" th:errors="*{roleId}" class="mt-2 text-sm text-red-600 flex items-center gap-1">
                            <i class="fas fa-exclamation-circle"></i> Lỗi
                        </p>
                    </div>

                </div>

                <!-- Submit Button -->
                <div class="pt-4 flex justify-end gap-3 border-t border-gray-100 mt-6">
                    <a th:href="@{/manager/account}" data-ajax="true" class="px-5 py-2.5 rounded-lg border border-gray-300 text-gray-700 font-medium hover:bg-gray-50 transition-colors">
                        Hủy
                    </a>
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-indigo-600 text-white font-medium hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-200 transition-all flex items-center gap-2">
                        <i class="fas fa-save"></i> <span>Lưu Tài khoản</span>
                    </button>
                </div>
                
            </form>
        </div>
    </div>
</body>
</html>
