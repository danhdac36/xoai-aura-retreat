<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/admin-layout :: layout(~{::div})}">

<head>
    <title>Quản lý Tài khoản</title>
</head>

<body>
    <div id="main-content" th:fragment="main-content" class="w-full">
        
        <!-- Header Section -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Quản lý Tài khoản</h1>
                <p class="text-gray-500 text-sm mt-1">Xem và quản lý tài khoản trong hệ thống</p>
            </div>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
                <a th:href="@{/manager/account/create}" data-ajax="true" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-colors flex items-center justify-center gap-2 whitespace-nowrap">
                    <span class="material-symbols-outlined text-[20px]">add</span> Thêm Tài khoản
                </a>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-gray-200 mb-6 gap-2">
            <a th:href="@{/manager/account(isDeleted=false)}" data-ajax="true" 
               class="px-4 py-2 font-medium text-sm transition-colors border-b-2"
               th:classappend="${isDeleted == null or !isDeleted ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}">
               Tài khoản hiện tại
            </a>
            <a th:href="@{/manager/account(isDeleted=true)}" data-ajax="true" 
               class="px-4 py-2 font-medium text-sm transition-colors border-b-2"
               th:classappend="${isDeleted != null and isDeleted ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-gray-500 hover:text-gray-700 hover:border-gray-300'}">
               <span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">delete</span> Thùng rác</span>
            </a>
        </div>

        <!-- Alert Messages -->
        <div th:if="${successMessage}" class="bg-green-50 border-l-4 border-green-500 p-4 mb-6 rounded-r-lg">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <span class="material-symbols-outlined text-green-500">check_circle</span>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-green-700 font-medium" th:text="${successMessage}"></p>
                </div>
            </div>
        </div>

        <div th:if="${errorMessage}" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-lg">
            <div class="flex items-center">
                <div class="flex-shrink-0">
                    <span class="material-symbols-outlined text-red-500">error</span>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700 font-medium" th:text="${errorMessage}"></p>
                </div>
            </div>
        </div>

        <!-- Table Section with localized scroll -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-[calc(100vh-250px)]">
            
            <!-- Table Toolbar (Search) -->
            <div class="p-4 border-b border-gray-100 bg-white">
                <form th:action="@{/manager/account}" method="get" class="relative w-full sm:w-80" id="searchForm" data-ajax="true">
                    <input type="hidden" name="isDeleted" th:value="${isDeleted}" />
                    <input type="text" name="email" th:value="${searchEmail}" placeholder="Tìm theo email..."
                           class="w-full pl-10 pr-4 py-2 rounded-lg border border-gray-300 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition-colors">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <span class="material-symbols-outlined text-gray-400 text-[20px]">search</span>
                    </div>
                </form>
            </div>
            
            <div class="overflow-x-auto overflow-y-auto flex-1">
                <table class="w-full whitespace-nowrap min-w-max">
                    <thead class="sticky top-0 z-10">
                        <tr class="bg-gray-50 border-b border-gray-200 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="px-6 py-4 bg-gray-50">ID</th>
                            <th class="px-6 py-4 bg-gray-50">Họ và Tên</th>
                            <th class="px-6 py-4 bg-gray-50">Email</th>
                            <th class="px-6 py-4 bg-gray-50">SĐT</th>
                            <th class="px-6 py-4 bg-gray-50">Chức vụ</th>
                            <th class="px-6 py-4 bg-gray-50">Trạng thái</th>
                            <th class="px-6 py-4 bg-gray-50 text-right">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr th:each="account : ${accounts}" class="hover:bg-gray-50/50 transition-colors">
                            <td class="px-6 py-4 text-sm text-gray-900 font-medium" th:text="${account.id}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${account.fullName}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${account.email}"></td>
                            <td class="px-6 py-4 text-sm text-gray-600" th:text="${account.phone}"></td>
                            
                            <!-- Role Badge -->
                            <td class="px-6 py-4">
                                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
                                      th:classappend="${
                                          account.role.roleName == 'ADMIN' ? 'bg-purple-100 text-purple-700' : 
                                          account.role.roleName == 'THERAPIST' ? 'bg-blue-100 text-blue-700' : 
                                          account.role.roleName == 'CHEF' ? 'bg-orange-100 text-orange-700' : 
                                          account.role.roleName == 'MANAGER' ? 'bg-indigo-100 text-indigo-700' :
                                          account.role.roleName == 'RECEPTIONIST' ? 'bg-teal-100 text-teal-700' :
                                          'bg-gray-100 text-gray-700'
                                      }"
                                      th:text="${account.role.roleName}">
                                </span>
                            </td>
                            
                            <!-- Status Badge -->
                            <td class="px-6 py-4">
                                <span th:if="${account.isDelete}" class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700">
                                    <span class="w-1.5 h-1.5 rounded-full bg-gray-500 mr-1.5"></span>
                                    Đã xóa
                                </span>
                                <span th:unless="${account.isDelete}">
                                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium"
                                          th:classappend="${
                                              account.status == 'ACTIVE' ? 'bg-green-100 text-green-700' :
                                              account.status == 'INACTIVE' ? 'bg-red-100 text-red-700' :
                                              'bg-yellow-100 text-yellow-700'
                                          }">
                                        <span class="w-1.5 h-1.5 rounded-full mr-1.5"
                                              th:classappend="${
                                                  account.status == 'ACTIVE' ? 'bg-green-500' :
                                                  account.status == 'INACTIVE' ? 'bg-red-500' :
                                                  'bg-yellow-500'
                                              }"></span>
                                        <span th:text="${account.status}"></span>
                                    </span>
                                </span>
                            </td>
                            
                            <!-- Actions (Icons) -->
                            <td class="px-6 py-4 text-sm text-right flex items-center justify-end gap-2">
                                <th:block th:if="${!account.isDelete}">
                                    <a th:if="${account.role.roleName != 'ADMIN'}" 
                                       th:href="@{/manager/account/edit/{id}(id=${account.id})}"
                                       data-ajax="true"
                                       title="Sửa"
                                       class="text-indigo-600 hover:text-indigo-900 w-8 h-8 flex items-center justify-center bg-indigo-50 hover:bg-indigo-100 rounded-md transition-colors">
                                        <span class="material-symbols-outlined text-[18px]">edit</span>
                                    </a>
                                    <form th:if="${account.role.roleName != 'ADMIN'}" 
                                          th:action="@{/manager/account/deactivate/{id}(id=${account.id})}" 
                                          method="post" class="inline" data-ajax="true">
                                        <button type="submit" 
                                                title="Vô hiệu hóa/Xóa"
                                                onclick="return confirm('Bạn có chắc chắn muốn vô hiệu hóa/xóa tài khoản này?');"
                                                class="text-red-600 hover:text-red-900 w-8 h-8 flex items-center justify-center bg-red-50 hover:bg-red-100 rounded-md transition-colors">
                                            <span class="material-symbols-outlined text-[18px]">delete</span>
                                        </button>
                                    </form>
                                </th:block>
                                <th:block th:if="${account.isDelete}">
                                    <form th:action="@{/manager/account/restore/{id}(id=${account.id})}" 
                                          method="post" class="inline" data-ajax="true">
                                        <button type="submit" 
                                                title="Khôi phục"
                                                onclick="return confirm('Bạn có chắc chắn muốn khôi phục hoạt động cho tài khoản này?');"
                                                class="text-green-600 hover:text-green-900 w-8 h-8 flex items-center justify-center bg-green-50 hover:bg-green-100 rounded-md transition-colors">
                                            <span class="material-symbols-outlined text-[18px]">restore</span>
                                        </button>
                                    </form>
                                </th:block>
                            </td>
                        </tr>
                        
                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(accounts)}">
                            <td colspan="7" class="px-6 py-8 text-center text-gray-500">
                                Không tìm thấy tài khoản nào
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        
    </div>
</body>
</html>
