<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Therapist Home - Aura Moon</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="bg-white p-8 rounded-lg shadow-md border border-slate-200 text-center max-w-sm w-full">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">Therapist Dashboard</h1>
        <p class="text-slate-500 mb-6 text-sm">Chào mừng bạn đăng nhập với quyền THERAPIST.</p>
        <form th:action="@{/auth/logout}" method="post">
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded transition-all font-medium">
                Đăng xuất (Logout)
            </button>
        </form>
    </div>
</body>
</html>
