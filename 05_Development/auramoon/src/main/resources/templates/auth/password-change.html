<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@400;500;700&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        .tonal-layer {
            background-color: rgba(251, 249, 248, 0.8);
            backdrop-filter: blur(8px);
        }

        .input-border-bottom {
            border: none;
            border-bottom: 1px solid #c8c7be;
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
        }

        .input-border-bottom:focus {
            box-shadow: none;
            border-bottom: 2px solid #566342;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#303030",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#fbf9f8",
                        "primary-fixed-dim": "#c9c6c2",
                        "secondary": "#566342",
                        "on-background": "#1b1c1c",
                        "primary": "#5f5e5b",
                        "on-primary": "#ffffff",
                        "surface-variant": "#e4e2e1",
                        "on-surface-variant": "#474741",
                        "on-tertiary-fixed-variant": "#284f2a",
                        "primary-fixed": "#e5e2dd",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f6f3f2",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#1c1c19",
                        "inverse-on-surface": "#f3f0f0",
                        "on-surface": "#1b1c1c",
                        "secondary-container": "#d7e5bb",
                        "surface-dim": "#dcd9d9",
                        "on-tertiary-container": "#4f784f",
                        "surface-container-highest": "#e4e2e1",
                        "error-container": "#ffdad6",
                        "on-primary-fixed-variant": "#474743",
                        "tertiary-fixed-dim": "#a5d2a2",
                        "tertiary-container": "#d1ffcb",
                        "on-tertiary-fixed": "#002106",
                        "background": "#fbf9f8",
                        "tertiary": "#406840",
                        "on-secondary-fixed": "#141f05",
                        "on-secondary-fixed-variant": "#3f4b2c",
                        "outline-variant": "#c8c7be",
                        "on-secondary-container": "#5a6745",
                        "secondary-fixed-dim": "#becca3",
                        "outline": "#787770",
                        "surface-container": "#f0eded",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface": "#fbf9f8",
                        "surface-tint": "#5f5e5b",
                        "primary-container": "#f5f2ed",
                        "tertiary-fixed": "#c1eebc",
                        "surface-container-high": "#eae8e7",
                        "secondary-fixed": "#dae8be",
                        "inverse-primary": "#c9c6c2",
                        "on-primary-container": "#6f6e6a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "margin-mobile": "20px",
                        "stack-lg": "32px",
                        "gutter": "24px",
                        "section-gap": "120px",
                        "stack-md": "16px",
                        "margin-desktop": "80px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "display-lg-mobile": ["Playfair Display"],
                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "display-lg": ["Playfair Display"],
                        "headline-sm": ["Playfair Display"],
                        "headline-lg": ["Playfair Display"]
                    },
                    "fontSize": {
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display-lg-mobile": ["40px", {"lineHeight": "48px", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "400"}],
                        "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                        "headline-lg": ["40px", {"lineHeight": "48px", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-surface font-body-md text-on-surface overflow-x-hidden min-h-screen">
<main class="flex min-h-screen">
    <!-- Image Section (Left) -->
    <section class="hidden lg:block lg:w-1/2 relative overflow-hidden">
        <div class="absolute inset-0 bg-cover bg-center transition-transform duration-1000 hover:scale-105"
             style="background-image: url('https://lh3.googleusercontent.com/aida/ADBb0ujC1JqPnqkD3WvY6dkRhH_4HardNKXM59i_-LanZtKuN6k2lYdmgdyutA0atHl4WDHrvlN_44xLo13QA9gV9XDwVo4xEaGh_sg681-ApFG-4koqCZY32ypVUWZ5lWW2RQ9_wRy64LAFlBGd5nVNkpEqpl_W4RRkWSLrK2LuoULx5tFOzEtmgRl6CAeB_CbpDk2S48_lQnNJ1kIoW-uhUG-zv70QdgtAuE8aNHCizzPf-kaioH9oKQyIxkY');">
        </div>
        <div class="absolute inset-0 bg-primary/10 mix-blend-multiply"></div>
        <div class="absolute inset-0 flex flex-col justify-end p-margin-desktop bg-gradient-to-t from-black/40 to-transparent">
            <h2 class="font-headline-lg text-white mb-stack-sm">Aman Retreats</h2>
            <p class="font-body-lg text-white/90 max-w-md">Kiến tạo không gian yên bình để làm mới tâm hồn và cơ thể
                bạn.</p>
        </div>
    </section>
    <!-- Form Section (Right) -->
    <section
            class="w-full lg:w-1/2 flex flex-col items-center justify-center bg-surface p-margin-mobile md:p-margin-desktop">
        <!-- Branding Header (Mobile and Top Anchor) -->
        <div class="w-full max-w-[420px] mb-stack-lg">
            <div class="flex items-center gap-2 mb-12">
                <span class="material-symbols-outlined text-secondary text-[32px]">spa</span>
                <span class="font-headline-sm text-primary tracking-tight">Aman Retreats</span>
            </div>
            <div class="space-y-stack-sm mb-12">
                <h1 class="font-headline-lg text-on-surface">Thiết lập mật khẩu mới</h1>
                <p class="font-body-md text-on-surface-variant">Vui lòng nhập mật khẩu mới cho tài khoản của bạn.</p>
            </div>
            <!-- Reset Form -->
            <form class="space-y-stack-lg" id="resetForm">
                <!-- New Password -->
                <div class="group relative">
                    <label class="font-label-md text-on-surface-variant group-focus-within:text-secondary transition-colors"
                           for="new_password">
                        Mật khẩu mới
                    </label>
                    <div class="relative flex items-center">
                        <input class="w-full input-border-bottom bg-transparent py-4 text-on-surface placeholder:text-outline-variant font-body-md focus:outline-none"
                               id="new_password" name="new_password" placeholder="••••••••" required="" type="password">
                        <button class="absolute right-0 text-outline hover:text-secondary transition-colors"
                                onclick="togglePassword('new_password')" type="button">
                            <span class="material-symbols-outlined" id="icon-new_password">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- Confirm Password -->
                <div class="group relative">
                    <label class="font-label-md text-on-surface-variant group-focus-within:text-secondary transition-colors"
                           for="confirm_password">
                        Xác nhận mật khẩu mới
                    </label>
                    <div class="relative flex items-center">
                        <input class="w-full input-border-bottom bg-transparent py-4 text-on-surface placeholder:text-outline-variant font-body-md focus:outline-none"
                               id="confirm_password" name="confirm_password" placeholder="••••••••" required=""
                               type="password">
                        <button class="absolute right-0 text-outline hover:text-secondary transition-colors"
                                onclick="togglePassword('confirm_password')" type="button">
                            <span class="material-symbols-outlined" id="icon-confirm_password">visibility</span>
                        </button>
                    </div>
                </div>
                <!-- CTA Button -->
                <div class="pt-stack-md">
                    <button class="w-full py-4 bg-secondary text-white font-label-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200"
                            type="submit">
                        Cập nhật mật khẩu
                    </button>
                </div>
                <!-- Navigation Back -->
                <div class="flex justify-center pt-stack-sm">
                    <a class="font-label-md text-on-surface-variant hover:text-secondary flex items-center gap-2 transition-colors duration-200"
                       href="#">
                        <span class="material-symbols-outlined text-[18px]">arrow_back</span>
                        Quay lại đăng nhập
                    </a>
                </div>
            </form>
        </div>
        <!-- Footer-ish copyright for context -->
        <footer class="mt-section-gap w-full max-w-[420px] text-center lg:text-left">
            <p class="font-label-md text-outline-variant">
                © 2024 Aman Wellness Management. All rights reserved.
            </p>
        </footer>
    </section>
</main>
<script>
    function togglePassword(inputId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById('icon-' + inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.textContent = "visibility_off";
        } else {
            input.type = "password";
            icon.textContent = "visibility";
        }
    }

    document.getElementById('resetForm').addEventListener('submit', function (e) {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        const originalText = btn.textContent;

        // Minimalist feedback animation
        btn.disabled = true;
        btn.textContent = 'Đang xử lý...';

        setTimeout(() => {
            btn.textContent = 'Thành công!';
            btn.classList.replace('bg-secondary', 'bg-tertiary');

            // Optional: Redirect or show success state
            setTimeout(() => {
                alert('Mật khẩu của bạn đã được cập nhật thành công.');
                btn.textContent = originalText;
                btn.classList.replace('bg-tertiary', 'bg-secondary');
                btn.disabled = false;
            }, 1500);
        }, 2000);
    });
</script>
</body>
</html>
