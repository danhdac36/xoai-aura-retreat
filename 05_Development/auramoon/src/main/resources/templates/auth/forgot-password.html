<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Aura Moon Retreat - Quên mật khẩu</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/auth/login.css}">
    <div th:replace="~{fragments/tailwind-config :: tailwind-config}"></div>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased overflow-hidden">
<main class="flex min-h-screen">
    <!-- Left Section: Visual Brand Identity -->
    <section class="hidden lg:block lg:w-3/5 relative overflow-hidden">
        <div class="absolute inset-0 z-10 bg-black/20"></div>
        <div class="absolute inset-0 w-full h-full transform scale-105 transition-transform duration-[10000ms] ease-out brand-bg-container">
            <img alt="Xoài Aura Retreat Villa & Pool" class="absolute inset-0 w-full h-full object-cover transition-opacity duration-1000 brand-bg-img opacity-100" th:src="@{/images/auth/login-bg3.jpg}">
        </div>
        <div class="absolute inset-0 z-20 flex flex-col justify-between p-margin-desktop">
            <div class="flex items-center gap-stack-sm">
                <span class="font-display-lg text-headline-sm text-surface-container-lowest tracking-[0.2em] uppercase font-semibold">Aura Moon</span>
            </div>
            <div class="max-w-xl">
                <p class="font-display-lg text-headline-lg text-surface-container-lowest leading-snug">
                    Nơi tâm hồn tìm thấy <br><span class="italic font-normal">sự tĩnh lặng tuyệt đối.</span>
                </p>
                <div class="w-24 h-[1px] bg-surface-container-lowest/40 mt-stack-lg"></div>
            </div>
        </div>
    </section>
    <!-- Right Section: Forgot Password Form -->
    <section class="w-full lg:w-2/5 flex flex-col justify-center items-center px-margin-mobile md:px-margin-desktop bg-surface relative">
        <div class="lg:hidden absolute top-8 left-8">
            <span class="font-display-lg text-headline-sm text-primary tracking-tight">Xoài Aura</span>
        </div>
        <div class="w-full max-w-md relative z-10">
            <!-- Back to Login Link -->
            <div class="mb-6">
                <a class="inline-flex items-center gap-1 font-label-md text-xs text-on-surface-variant hover:text-secondary transition-colors" th:href="@{/auth/login}">
                    <span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Quay lại Đăng nhập
                </a>
            </div>

            <div class="mb-8">
                <h1 class="font-headline-lg text-headline-lg text-on-surface font-semibold tracking-tight mb-2">Quên mật khẩu?</h1>
                <p class="font-body-md text-body-md text-on-surface-variant">Nhập địa chỉ email của bạn, hệ thống sẽ tự động khôi phục và gửi mật khẩu mới cho bạn qua email.</p>
            </div>

            <!-- Form -->
            <form class="space-y-stack-lg" method="post" th:action="@{/auth/forgot-password}">
                <!-- Email Field -->
                <div class="space-y-2">
                    <label class="font-label-md text-xs text-on-surface-variant uppercase tracking-[0.15em]" for="email">Email</label>
                    <input class="w-full bg-surface-container-low border-t-0 border-l-0 border-r-0 border-b-2 border-outline-variant focus:border-secondary focus:ring-0 transition-colors px-2 py-3 input-minimal font-body-md text-sm text-on-surface placeholder-outline-variant/60"
                           id="email" name="email" placeholder="email@example.com" required type="email" th:value="${email}">
                </div>

                <!-- Submit Button -->
                <button class="w-full bg-secondary text-on-secondary py-4 font-label-md text-sm uppercase tracking-[0.15em] rounded-lg shadow-sm hover:bg-secondary/95 active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-2" type="submit">
                    Khôi phục mật khẩu
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
                </button>
            </form>

            <!-- Error Notifications -->
            <div class="mt-4" th:if="${error}">
                <p class="text-red-500 text-sm" th:text="${error}"></p>
            </div>
        </div>
    </section>
</main>
</body>
</html>
