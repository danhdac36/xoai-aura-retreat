<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Hành Trình Chăm Sóc Sức Khỏe | Xoai Aura Retreat</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1"
        rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/guest/itinerary.css}">
</head>

<body class="bg-[#fbf9f8] text-[#1b1c1c] font-sans">
    <main class="min-h-screen py-16 px-4 md:px-8 max-w-3xl mx-auto">
        <a th:href="@{/packages}" class="inline-flex items-center gap-2 text-[#566342] hover:underline mb-8">
            <span class="material-symbols-outlined">arrow_back</span> Quay lại khám phá gói
        </a>

        <!-- Itinerary Header Glassmorphism -->
        <div class="glass-card bg-white/70 backdrop-blur-md border border-white/20 p-8 rounded-2xl shadow-xl mb-12">
            <span class="text-sm font-semibold tracking-wider text-[#566342] uppercase block">Lịch Trình Nghỉ Dưỡng Trị
                Liệu</span>
            <h1 class="text-3xl md:text-4xl font-serif text-gray-900 mt-2"
                th:text="'Chào mừng, ' + ${timeline.guestName}">Chào mừng khách hàng</h1>
            <p class="text-gray-500 mt-2" th:text="'Đơn đặt phòng #' + ${timeline.bookingId}">Mã đặt phòng #100</p>
        </div>

        <!-- Vertical Timeline Section -->
        <section class="relative border-l border-gray-200 ml-4 md:ml-32 pl-8 space-y-12">
            <div th:each="e, stat : ${timeline.events}" class="relative">
                <!-- Timeline Dot Indicator -->
                <span
                    class="absolute -left-[41px] top-1.5 w-6 h-6 rounded-full border-4 border-white bg-[#566342] shadow-sm flex items-center justify-center"></span>

                <!-- Timeline Left Date/Time (Desktop only) -->
                <div class="hidden md:block absolute -left-40 top-1.5 w-32 text-right">
                    <span class="font-semibold text-gray-900 block text-sm"
                        th:text="${#temporals.format(e.time, 'dd/MM')}">12/06</span>
                    <span class="text-xs text-gray-400 block mt-0.5"
                        th:text="${#temporals.format(e.time, 'HH:mm')}">14:00</span>
                </div>

                <!-- Timeline Card Box -->
                <div
                    class="glass-card bg-white/50 backdrop-blur-sm border border-gray-100 p-6 rounded-xl shadow-sm hover:shadow-md transition-shadow">
                    <!-- Mobile Time Badge -->
                    <div class="md:hidden flex gap-2 items-center text-xs font-semibold text-[#566342] mb-2">
                        <span class="material-symbols-outlined text-sm">schedule</span>
                        <span
                            th:text="${#temporals.format(e.time, 'dd/MM')} + ' - ' + ${#temporals.format(e.time, 'HH:mm')}">12/06
                            14:00</span>
                    </div>

                    <h3 class="text-lg font-bold text-gray-900" th:text="${e.eventName}">Tên sự kiện</h3>
                    <p class="text-sm text-gray-600 mt-2 leading-relaxed" th:text="${e.description}">Mô tả chi tiết sự
                        kiện.</p>
                </div>
            </div>
        </section>
    </main>
    <script th:src="@{/js/guest/itinerary.js}"></script>
</body>

</html>
