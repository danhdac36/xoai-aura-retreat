<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<body>
    <th:block th:fragment="public-header">
        <header
            class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-desktop py-6 bg-transparent transition-all duration-300">
            <a th:href="@{/}"
                class="logo font-headline-sm text-headline-sm text-white italic hover:opacity-80 transition-all duration-300"></a>
            <a th:href="@{/}"
                class="font-display-lg text-2xl text-white hover:opacity-80 transition-opacity tracking-tight uppercase"
                style="font-family: 'Playfair Display'; font-size: 1.5rem; line-height: 2rem;">Xoai Aura</a>
            <nav class="hidden md:flex items-center gap-stack-lg">
                <a th:href="@{/packages}"
                    class="nav-link font-label-md text-label-md text-white/80 hover:text-white hover:border-b-2 hover:border-white pb-1 transition-all duration-300 uppercase tracking-widest whitespace-nowrap">Retreats</a>
                <a th:href="@{/wellness}"
                    class="nav-link font-label-md text-label-md text-white/80 hover:text-white hover:border-b-2 hover:border-white pb-1 transition-all duration-300 uppercase tracking-widest whitespace-nowrap">Wellness</a>
                <a th:href="@{/villas}"
                    class="nav-link font-label-md text-label-md text-white/80 hover:text-white hover:border-b-2 hover:border-white pb-1 transition-all duration-300 uppercase tracking-widest">Villas</a>
                <a th:href="@{/spa}"
                    class="nav-link font-label-md text-label-md text-white/80 hover:text-white hover:border-b-2 hover:border-white pb-1 transition-all duration-300 uppercase tracking-widest">Spa</a>
                <a th:href="@{/culinary}"
                    class="nav-link font-label-md text-label-md text-white/80 hover:text-white hover:border-b-2 hover:border-white pb-1 transition-all duration-300 uppercase tracking-widest">Culinary</a>
            </nav>
            <div class="hidden md:flex items-center gap-4">
                <!-- Book Now Button -->
                <a th:href="@{/packages}"
                    class="bg-secondary text-on-secondary font-label-md text-label-md py-3 px-8 rounded hover:opacity-90 transition-opacity uppercase tracking-widest text-center">
                    Book Now
                </a>
                
                <!-- Login Button (Guest) -->
                <a sec:authorize="!isAuthenticated()" th:href="@{/auth/login}"
                    class="text-white hover:text-white/80 font-label-md uppercase tracking-widest border border-white/30 px-6 py-3 rounded transition-colors duration-300">
                    Login
                </a>
                
                <!-- Profile & Logout (Authenticated) -->
                <div sec:authorize="isAuthenticated()" class="flex items-center gap-4 border-l border-white/30 pl-4">
                    <a th:href="@{/profile/me}" class="text-white hover:text-white/80 transition-colors flex items-center" title="My Profile">
                        <span class="material-symbols-outlined text-2xl">account_circle</span>
                    </a>
                    <form th:action="@{/auth/logout}" method="post" class="m-0 p-0 flex items-center">
                        <button type="submit" class="text-white/80 hover:text-red-400 transition-colors flex items-center" title="Logout">
                            <span class="material-symbols-outlined text-2xl">logout</span>
                        </button>
                    </form>
                </div>
            </div>
            <button class="md:hidden text-white">
                <span class="material-symbols-outlined">menu</span>
            </button>
        </header>
    </th:block>
</body>

</html>
