<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:th="http://www.thymeleaf.org">

<body>
<header class="flex justify-between items-center h-20 px-margin-desktop sticky top-0 bg-surface-bright border-b border-outline-variant z-40"
        th:fragment="header">
    <div class="flex items-center gap-4">
        <div class="relative">
                <span class="absolute inset-y-0 left-3 flex items-center text-on-surface-variant">
                    <span class="material-symbols-outlined text-xl" data-icon="search">search</span>
                </span>
            <input
                    class="pl-10 pr-4 py-2 bg-surface-container border-none rounded-full text-sm focus:ring-2 focus:ring-primary/20 w-64 transition-all"
                    placeholder="Tìm kiếm hồ sơ..." type="text">
        </div>
    </div>
    <div class="flex items-center gap-6">
        <div class="flex items-center gap-4 text-on-surface-variant">
            <button class="hover:text-primary transition-all p-2 rounded-full hover:bg-surface-container">
                <span class="material-symbols-outlined" data-icon="notifications">notifications</span>
            </button>
            <button class="hover:text-primary transition-all p-2 rounded-full hover:bg-surface-container">
                <span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
            </button>
        </div>
        <div class="flex items-center gap-3 pl-6 border-l border-outline-variant">
            <div class="text-right" sec:authorize="isAuthenticated()">
                <p class="text-sm font-semibold" sec:authentication="principal.fullName">Tên</p>
                <p class="text-xs text-on-surface-variant" sec:authentication="principal.roleName">Role</p>
            </div>
            <img alt="Staff Profile" class="w-10 h-10 rounded-full object-cover border border-outline-variant"
                 th:src="${#authentication.principal.avatar != null ? #authentication.principal.avatar : 'https://lh3.googleusercontent.com/aida-public/AB6AXuCjxKxWNM9Mdwd1q-Ntb2XBP2tWZHOJnGCL2k0tVQxMSkLJ5lXLFy4YVhr2xzIstoSmY3eeDxmsvUxgGR1ZidvlK-lkv5B2u_qNh0i4tffRO5hu4TTt-NPTZVPcnEYjcqbIjcIGI-opV3GJWWC6PWB1oftS39SpGphQD7UDCSz0WfQkOA8VoDi3CIwXCLILpVge3ruSs76fgrW729VAHHhA6RpB3syTU-QWYVL4_wHFwND14cNM_H0Nchj6_3Bf1sj91ZcH50GAf6s'}">
        </div>
    </div>
</header>
</body>

</html>
