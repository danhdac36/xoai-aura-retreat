<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Aura Admin'">Aura Admin</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #c8c7be; border-radius: 10px; }
        .invoice-print-area { animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    
    <!-- Tailwind Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff", "surface-dim": "#dcd9d9", "on-tertiary": "#ffffff", "on-error-container": "#93000a", "inverse-surface": "#303030", "outline": "#787770", "surface-container": "#f0eded", "on-tertiary-fixed-variant": "#284f2a", "on-secondary-fixed": "#141f05", "primary-fixed-dim": "#c9c6c2", "secondary": "#566342", "surface-container-lowest": "#ffffff", "on-secondary-fixed-variant": "#3f4b2c", "error-container": "#ffdad6", "surface-container-highest": "#e4e2e1", "secondary-container": "#d7e5bb", "tertiary-container": "#d1ffcb", "secondary-fixed": "#dae8be", "on-error": "#ffffff", "tertiary-fixed": "#c1eebc", "tertiary": "#406840", "surface-tint": "#5f5e5b", "on-tertiary-container": "#4f784f", "surface-bright": "#fbf9f8", "primary-container": "#f5f2ed", "on-secondary": "#ffffff", "secondary-fixed-dim": "#becca3", "on-surface": "#1b1c1c", "on-secondary-container": "#5a6745", "tertiary-fixed-dim": "#a5d2a2", "on-tertiary-fixed": "#002106", "on-background": "#1b1c1c", "on-primary-fixed-variant": "#474743", "on-surface-variant": "#474741", "surface-container-high": "#eae8e7", "surface-variant": "#e4e2e1", "inverse-on-surface": "#f3f0f0", "inverse-primary": "#c9c6c2", "primary": "#5f5e5b", "error": "#ba1a1a", "background": "#fbf9f8", "primary-fixed": "#e5e2dd", "on-primary-fixed": "#1c1c19", "outline-variant": "#c8c7be", "on-primary-container": "#6f6e6a", "surface": "#fbf9f8", "surface-container-low": "#f6f3f2"
                    },
                    "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
                    "spacing": { "stack-md": "16px", "section-gap": "120px", "gutter": "24px", "margin-mobile": "20px", "stack-lg": "32px", "margin-desktop": "80px", "stack-sm": "8px" },
                    "fontFamily": { "display-lg-mobile": ["Playfair Display"], "label-md": ["Inter"], "headline-lg": ["Playfair Display"], "body-lg": ["Inter"], "body-md": ["Inter"], "headline-sm": ["Playfair Display"], "display-lg": ["Playfair Display"] },
                    "fontSize": { "display-lg-mobile": ["40px", {"lineHeight": "48px", "fontWeight": "400"}], "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}], "headline-lg": ["40px", {"lineHeight": "48px", "fontWeight": "400"}], "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}], "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "500"}], "display-lg": ["64px", {"lineHeight": "72px", "letterSpacing": "-0.02em", "fontWeight": "400"}] }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden">

    <!-- Insert Sidebar -->
    <th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>

    <!-- Main Content Area -->
    <main class="ml-64 h-screen flex flex-col">
        <!-- Insert Header -->
        <th:block th:replace="~{fragments/header :: header}"></th:block>

        <!-- Content Canvas -->
        <div class="flex-1 overflow-y-auto bg-surface-bright p-margin-desktop space-y-10">
            <th:block th:replace="${content}"></th:block>
        </div>
    </main>

</body>
</html>
